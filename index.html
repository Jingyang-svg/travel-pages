<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>泰国之旅</title>
<style>
  :root{
    --bg:#f4f0e6; --surface:#fffdf7; --ink:#22312e; --soft:#5d6a65;
    --line:#ddd6c5; --teal:#0e7c7b; --orange:#c8632a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:100%;max-width:560px;text-align:center}
  .kicker{font-size:13px;letter-spacing:.3em;color:var(--soft);text-transform:uppercase;margin-bottom:14px}
  h1{font-family:Georgia,"Songti SC",serif;font-size:34px;line-height:1.2;margin-bottom:8px}
  .sub{color:var(--soft);font-size:15px;margin-bottom:36px}

  .gate{display:flex;flex-direction:column;align-items:center;gap:14px}
  .gate input{
    width:180px;padding:14px;text-align:center;font-size:22px;letter-spacing:.4em;
    background:var(--surface);border:2px solid var(--line);border-radius:14px;
    color:var(--ink);outline:none;
  }
  .gate input:focus{border-color:var(--teal)}
  .gate button{
    padding:12px 36px;font-size:15px;font-weight:600;color:#fff;background:var(--teal);
    border:none;border-radius:999px;cursor:pointer;letter-spacing:.1em;
  }
  .gate button:active{transform:scale(.97)}
  .gate .err{color:#b33;background:#fbe9e7;padding:8px 16px;border-radius:8px;font-size:13px;display:none}
  .gate.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .cards{display:none;flex-direction:column;gap:16px;text-align:left}
  .cards.show{display:flex}
  a.card{
    display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:24px;text-decoration:none;color:var(--ink);
    box-shadow:0 2px 10px rgba(34,49,46,.06);transition:transform .15s;
  }
  a.card:active{transform:scale(.99)}
  a.card .tag{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--teal)}
  a.card.orange .tag{color:var(--orange)}
  a.card h2{font-family:Georgia,"Songti SC",serif;font-size:22px;margin:6px 0 4px}
  a.card p{font-size:14px;color:var(--soft);line-height:1.5}
  a.card .go{display:inline-block;margin-top:14px;font-size:14px;font-weight:600}
  a.card .go:after{content:" →"}
  .foot{margin-top:36px;font-size:12.5px;color:var(--soft)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Bangkok × Phuket</div>
    <h1>泰国之旅</h1>
    <div class="sub">YY &amp; BB · 6 天 5 晚 · 2026.10</div>

    <div class="gate" id="gate">
      <input type="password" id="pin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
      <button id="go">进入</button>
      <div class="err" id="err">密码不对哦</div>
    </div>

    <div class="cards" id="cards">
      <a class="card" href="t6h2k9m4/guide.html">
        <div class="tag">出发前</div>
        <h2>行程攻略手册</h2>
        <p>每日行程、倒计时、手绘路线地图、一键导航与地点介绍。</p>
        <span class="go">打开攻略</span>
      </a>
      <a class="card orange" href="t6h2k9m4/book/">
        <div class="tag">归来后</div>
        <h2>旅行纪念册</h2>
        <p>这一路的照片与故事，翻开慢慢看。</p>
        <span class="go">打开纪念册</span>
      </a>
    </div>

    <div class="foot">单文件 · 离线可看 · 手机友好</div>
  </div>

<script>
  var PIN = [53,50,49,49].map(function(c){return String.fromCharCode(c)}).join('');
  var gate = document.getElementById('gate');
  var cards = document.getElementById('cards');
  var input = document.getElementById('pin');
  var err = document.getElementById('err');

  function unlock(){
    gate.style.display = 'none';
    cards.classList.add('show');
    try{ localStorage.setItem('tb_ok','1'); }catch(e){}
  }
  function tryUnlock(){
    if(input.value === PIN){ unlock(); }
    else{
      err.style.display = 'inline-block';
      gate.classList.remove('shake');
      void gate.offsetWidth;
      gate.classList.add('shake');
      input.value = '';
      input.focus();
    }
  }
  document.getElementById('go').addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });

  try{ if(localStorage.getItem('tb_ok')==='1') unlock(); else input.focus(); }catch(e){ input.focus(); }
</script>
</body>
</html>
